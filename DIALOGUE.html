<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ZYPHERE · WORKING DIALOGUE</title>
<style>
:root{--bg:#06060b;--p:#ff4fa3;--c:#37e6d8;--y:#ffc857;--m:#777792}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6e6f2;font:12px Consolas,monospace}
header{padding:12px 20px;border-bottom:1px solid #1d1d2e;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:17px;color:#fff}h1 b{color:var(--p)}
.live{background:var(--c);color:#041014;padding:4px 12px;border-radius:999px;font-weight:700;font-size:10px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.45}}
.meta{color:var(--m);font-size:10px}
main{max-width:1100px;margin:14px auto;padding:0 14px}
.turn{border-left:2px solid #22223a;padding:7px 12px;margin:7px 0;background:#0a0a12;line-height:1.65}
.turn b{color:var(--c)}.turn .tag{float:right;font-size:9px;color:var(--m)}
.turn.STANDING_ORDER{border-color:var(--p);background:#180d16}
.turn.STANDING_ORDER b{color:var(--p)}
.turn.CROSS_ASK{border-color:var(--y)}.turn.CROSS_ASK b{color:var(--y)}
.turn.NEW_TECH{border-color:var(--g, #6ee35e)}
.turn.WORKING{border-color:var(--c);background:#0b1718;text-align:center;color:var(--c);font-weight:700;letter-spacing:2px}
footer{border-top:1px solid #1d1d2e;padding:10px;text-align:center;color:var(--m);font-size:9px;letter-spacing:2px}
a{color:var(--c)}</style></head><body>
<header><h1><b>ZYPHERE</b> · CONTINUOUS WORKING DIALOGUE</h1>
<span class="live" id="badge">● WORKING</span>
<span class="meta" id="meta">กำลังเชื่อม…</span></header>
<main id="feed">กำลังโหลดบทสนทนา…</main>
<footer>ผู้พัฒนาไม่ต้องออกคำสั่ง — ระบบถาม ตอบ ถามข้ามแผนก และกระตุ้นตัวเองทุกนาที ·
<a href="ORCHESTRA.html">ORCHESTRA →</a> · <a href="AGENT_GRID.html">AGENT GRID →</a></footer>
<script>
const BK='https://zyphere-ai-agent.onrender.com';
async function load(){
 try{
  const r=await fetch(BK+'/api/dialogue');const d=await r.json();
  if(!d.ok)throw new Error('x');
  document.getElementById('meta').textContent='รอบ '+d.round+' · Turn ทั้งหมด '+d.total+' · อัปเดต '+new Date(d.t*1000).toLocaleTimeString('th-TH');
  document.getElementById('feed').innerHTML=(d.last||[]).map(x=>
   '<div class="turn '+x.tag+'"><span class="tag">'+x.tag+'</span><b>'+x.who+'</b><br>'+x.text+'</div>').join('');
 }catch(e){document.getElementById('feed').innerHTML='error '+e.message;
  document.getElementById('badge').textContent='RECONNECTING'}
}
load();setInterval(load,5000);
</script></body></html>
