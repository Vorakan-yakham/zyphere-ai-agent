<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zyphere Store — Admin ตรวจชำระ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:#f8fafc;color:#1f2430}
header{background:linear-gradient(135deg,#0f172a,#334155);color:#fff;padding:22px;text-align:center}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;opacity:.8;font-size:13px}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.bar{display:flex;gap:8px;margin-bottom:16px}
input,button{padding:10px;border-radius:10px;border:1px solid #cbd5e1;font-size:14px}
input{flex:1;min-width:0}button{border:0;background:#2563eb;color:#fff;cursor:pointer;font-weight:600}
.card{background:#fff;border:1px solid #e5e8ef;border-radius:14px;padding:16px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}.m{color:#64748b;font-size:13px;line-height:1.7}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.await{background:#fef3c7;color:#92400e}.appr{background:#dcfce7;color:#166534}.rej{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;margin-top:10px}.ok{background:#16a34a}.no{background:#dc2626}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;color:#92400e;font-size:13px;margin-bottom:16px}
code{background:#f1f5f9;padding:2px 6px;border-radius:6px;font-size:12px}
</style></head><body>
<header><h1>🔐 Zyphere — ตรวจสอบการชำระ (Admin)</h1><p>ตรวจรายการโอน PromptPay 0941939686 แล้วอนุมัติการดาวน์โหลด</p></header>
<div class="wrap">
<div class="note">ใส่ <b>Admin token</b> (ได้จากหน้า Admin → login) แล้วกดโหลดคำสั่ง — ระบบจะไม่มีทางอนุมัติถ้า token ไม่ถูกต้อง</div>
<div class="bar"><input id="tok" type="password" placeholder="วาง admin token ที่นี่..."><button onclick="load()">โหลดคำสั่ง</button></div>
<div id="list"></div>
</div>
<script>
const API='https://zyphere-ai-agent.onrender.com';
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function load(){
 const t=document.getElementById('tok').value.trim();
 if(!t){alert('ใส่ admin token ก่อนครับ');return}
 try{
  const r=await fetch(API+'/api/store/orders?token='+encodeURIComponent(t));
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'HTTP '+r.status);
  const all=j.orders||[];const pend=j.pending||[];
  document.getElementById('list').innerHTML=
   '<p class="m">ทั้งหมด '+all.length+' ออเดอร์ · รอตรวจ '+pend.length+' รายการ</p>'+
   (all.length?all.map(o=>{
     const cls=o.status==='approved'?'appr':(o.status==='rejected'?'rej':'await');
     const th=(o.status==='awaiting_verification'||o.status==='awaiting_payment')?
       '<div class="row"><button class="ok" onclick="act(\'approve\',\''+o.id+'\')">✅ อนุมัติ</button>'+
       '<button class="no" onclick="act(\'reject\',\''+o.id+'\')">✕ ปฏิเสธ</button></div>':'';
     return '<div class="card"><h3>'+esc(o.product)+' — ฿'+esc(o.amount)+'</h3>'+
      '<div class="m">Order: <code>'+esc(o.id)+'</code><br>ผู้ซื้อ: '+esc(o.buyer||'-')+
      '<br>หลักฐานโอน: '+esc(o.ref||'ยังไม่ส่ง')+'<br>เวลา: '+new Date(o.t*1000).toLocaleString('th-TH')+'</div>'+
      '<span class="st '+cls+'">'+esc(o.status)+'</span>'+th+'</div>';
   }).join(''):'<p class="m">ยังไม่มีออเดอร์</p>');
 }catch(e){document.getElementById('list').innerHTML='<p class="m" style="color:#dc2626">โหลดไม่ได้: '+esc(e.message)+'</p>'}
}
async function act(action,id){
 const t=document.getElementById('tok').value.trim();
 try{
  const r=await fetch(API+'/api/store/'+action,{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({token:t,order_id:id})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'failed');
  alert(action==='approve'?'อนุมัติแล้ว — ผู้ซื้อสามารถดาวน์โหลดได้':'ปฏิเสธแล้ว');
  load();
 }catch(e){alert('ทำรายการไม่ได้: '+e.message)}
}
</script></body></html>
