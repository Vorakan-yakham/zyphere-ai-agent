<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zyphere Store — หลังบ้าน (Admin)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',Inter,system-ui,sans-serif;background:#f7f8fc;color:#1b1f2a}
header{background:linear-gradient(120deg,#4338ca,#7c3aed);color:#fff;padding:24px;text-align:center}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;opacity:.9;font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;color:#92400e;font-size:13px;margin-bottom:16px}
.bar{display:flex;gap:8px;margin-bottom:16px}
input,button{padding:10px;border-radius:10px;border:1px solid #e2e8f0;font-size:14px}
input{flex:1;min-width:0}button{border:0;background:#4f46e5;color:#fff;cursor:pointer;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #e8eaf1;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(17,24,39,.04)}
.kpi b{display:block;font:700 26px Inter;color:#4f46e5;margin-top:6px}
.kpi span{font-size:12px;color:#6b7280}
.panel{background:#fff;border:1px solid #e8eaf1;border-radius:16px;padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eef0f5}
th{color:#6b7280;font-weight:600}
.st{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px}
.st-wait{background:#fef3c7;color:#92400e}.st-paid{background:#dcfce7;color:#166534}.st-rej{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ok{background:#16a34a}.no{background:#dc2626}
code{background:#f1f5f9;border-radius:6px;padding:2px 6px;font-size:11px}
</style></head><body>
<header><h1>🔐 หลังบ้าน Zyphere Store</h1><p>ติดตามการคลิก ยอดขาย ลูกค้า และตรวจสอบออเดอร์</p></header>
<div class="wrap">
<div class="note">ใส่ <b>Admin token</b> (จากหน้า Admin → login) แล้วกดโหลดข้อมูล ข้อมูลทั้งหมดมาจากระบบจริง ไม่ได้ประมาณการ</div>
<div class="bar"><input id="tok" type="password" placeholder="วาง admin token หรือล็อกอิน Google ด้านล่าง"><button onclick="load()">โหลดข้อมูล</button></div>
<div style="display:flex;gap:8px;margin-bottom:16px">
 <button class="ok" onclick="googleLogin()">เข้าสู่ระบบด้วย Google (เจ้าของ)</button>
 <button class="no" onclick="logout()">Logout</button>
 <span class="mini" id="who"></span></div>

<div id="dash" style="display:none">
 <div class="cards" id="kpis"></div>
 <div class="panel"><h2>สินค้าที่ถูกคลิกมากที่สุด</h2><div id="top"></div></div>
 <div class="panel"><h2>ออเดอร์ทั้งหมด</h2><div id="list"></div></div>
 <button class="no" style="width:100%" onclick="resetDemo()">ล้างข้อมูลทดสอบ</button>
</div>
</div>
<script>
const API='https://zyphere-ai-agent.onrender.com';
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function money(n){return '฿'+Number(n||0).toLocaleString('th-TH')}
function utoken(){return localStorage.getItem('zy_token')||''}
function googleLogin(){location.href=API+'/api/auth/google?next='+encodeURIComponent(location.href.split('#')[0])}
async function logout(){const t=utoken();try{await fetch(API+'/api/auth/logout?token='+encodeURIComponent(t))}catch(e){}
 try{localStorage.removeItem('zy_token')}catch(e){}document.getElementById('tok').value='';
 document.getElementById('who').textContent='ออกจากระบบแล้ว';load()}
async function boot(){
 const h=location.hash.match(/oauth=([^&]+)/);
 if(h){try{const p=new URLSearchParams(decodeURIComponent(h[1]));localStorage.setItem('zy_token',p.get('token')||'');
  history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
 const t=(localStorage.getItem('zy_admin_token')||'')||utoken();
 const em=localStorage.getItem('zy_email')||localStorage.getItem('zy_admin_user')||'';
 if(em){document.getElementById('who').textContent='จดจำบัญชี: '+em;
  if(document.getElementById('adUser'))document.getElementById('adUser').value=em}
 if(t){document.getElementById('tok').value=t;
  try{const me=await(await fetch(API+'/api/store/me?token='+encodeURIComponent(t))).json();
   if(me.ok){document.getElementById('who').textContent='ล็อกอินเป็น '+(me.me.name||me.me.email)+(me.me.is_owner?' (เจ้าของ)':'');}
  }catch(e){}
  await load();
 }
}
async function load(){
 const t=document.getElementById('tok').value.trim();
 if(!t){alert('ใส่ admin token ก่อนครับ');return}
 try{
  const s=await(await fetch(API+'/api/store/stats?token='+encodeURIComponent(t))).json();
  const o=await(await fetch(API+'/api/store/orders?token='+encodeURIComponent(t))).json();
  if(!s.ok||!o.ok)throw new Error((s.error||o.error)||'HTTP error');
  document.getElementById('dash').style.display='block';
  document.getElementById('kpis').innerHTML=[
   ['คลิกซื้อทั้งหมด',s.clicks],['ออเดอร์',s.orders],['จ่ายแล้ว',s.paid],
   ['รอตรวจ',s.pending],['ยอดขาย',money(s.revenue)],['ลูกค้า',s.customers]
  ].map(x=>'<div class="kpi"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
  document.getElementById('top').innerHTML=(s.top_clicked||[]).length?
   '<table><tr><th>สินค้า</th><th>คลิก</th></tr>'+s.top_clicked.map(x=>
   '<tr><td>'+esc(x.product)+'</td><td>'+x.clicks+'</td></tr>').join('')+'</table>':'ยังไม่มีข้อมูลการคลิก';
  document.getElementById('list').innerHTML=(o.orders||[]).length?
   '<table><tr><th>สินค้า</th><th>ยอด</th><th>ลูกค้า</th><th>หลักฐาน</th><th>สถานะ</th><th>จัดการ</th></tr>'+
   o.orders.map(x=>{
    const st=x.status,cls=st==='paid'?'st-paid':(st==='rejected'?'st-rej':'st-wait');
    const act=(st==='awaiting_verification'||st==='awaiting_payment')?
     '<div class="row"><button class="ok" onclick="act(\'approve\',\''+x.id+'\')">อนุมัติ</button>'+
     '<button class="no" onclick="act(\'reject\',\''+x.id+'\')">ปฏิเสธ</button></div>':'-';
    return '<tr><td>'+esc(x.product)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.buyer||x.email||'-')+
     '</td><td>'+esc(x.ref||'-')+'</td><td><span class="st '+cls+'">'+esc(st)+'</span></td><td>'+act+'</td></tr>';
   }).join('')+'</table>':'ยังไม่มีออเดอร์';
 }catch(e){alert('โหลดไม่ได้: '+e.message)}
}
async function resetDemo(){
 if(!confirm('ล้างออเดอร์และข้อมูลคลิกทั้งหมดใช่ไหม?'))return;
 const t=document.getElementById('tok').value.trim();
 try{const r=await(await fetch(API+'/api/store/reset',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({token:t})})).json();
  if(!r.ok)throw new Error(r.error||'failed');alert('ล้างข้อมูลทดสอบแล้ว');load();}
 catch(e){alert(e.message)}
}
async function act(a,id){
 const t=document.getElementById('tok').value.trim();
 try{const r=await(await fetch(API+'/api/store/'+a,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({token:t,order_id:id})})).json();
  if(!r.ok)throw new Error(r.error||'failed');alert(a==='approve'?'อนุมัติแล้ว':'ปฏิเสธแล้ว');load();}
 catch(e){alert(e.message)}
}
boot();
</script></body></html>
