}

button{

}

button:disabled{
  cursor:not-allowed;
  opacity:.55
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes blink{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0)
  }

  40%{
    opacity:1;
    transform:translateY(-3px)
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(0,100,224,.18)
  }

  50%{
    box-shadow:0 0 0 5px rgba(0,100,224,.07)
  }
}

.msg-in{
  animation:rise .28s ease both
}

.typing-dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:var(--muted);
  display:inline-block;
  animation:blink 1.1s infinite
}

.typing-dot:nth-child(2){
  animation-delay:.15s
}

.typing-dot:nth-child(3){
  animation-delay:.3s
}

.logo-mark{
  transition:transform .6s ease
}

.logo-btn:hover .logo-mark{
  animation:spinSlow .8s ease
}

.menu-row{
  transition:transform .18s ease,background .18s ease
}

.menu-row:hover{
  transform:translateX(3px);
  background:var(--surface-2)
}

.sidebar-icon{
  transition:transform 150ms ease,background 150ms ease
}

.menu-row:hover .sidebar-icon{
  transform:scale(1.15) translateY(-2px);
  background:var(--surface-3)
}

.icon-action{
  transition:transform 150ms ease,background 150ms ease,opacity 150ms ease
}

.icon-action:hover{
  transform:scale(1.15) translateY(-2px);
  background:var(--surface-3)
}

.chip-btn{
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease
}

.chip-btn:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-sm)
}

.input-card{
  transition:box-shadow .2s ease,border-color .2s ease
}

.input-card:focus-within{
  box-shadow:0 0 0 3px rgba(0,100,224,.12),var(--shadow);
  border-color:#bcd6f7;
