 const prefs=(mem.preferences||[]).slice(-12).map(x=>'- '+x.text); if(prefs.length)parts.push('ความชอบ/แนวทางของผู้ใช้:\n'+prefs.join('\n'));

 if(mem.history_summary)parts.push('สรุปบริบทเดิม: '+mem.history_summary);

// provider calls
async function readSSE(r,pick,on){const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='';for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(!d||d==='[DONE]')continue;try{const t=pick(JSON.parse(d));if(t){full+=t;on(full)}}catch(e){}}}if(!full)throw new Error('ไม่ได้รับคำตอบ');return full}
async function fail(r,n){let j={};try{j=await r.json()}catch(e){}throw new Error((Array.isArray(j)?j[0]:j).error?.message||n+' '+r.status)}
async function callProv(id,msgs,img,sig,on,sys){
 const p=P[id],k=key(id);let err='';
 if(id==='gemini'){
  const contents=msgs.map((m,i)=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}].concat(img&&img.length&&i===msgs.length-1?img.map(u=>({inline_data:{mime_type:u.split(';')[0].slice(5),data:u.split(',')[1]}})):[])}));
  for(const m of p.models){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':streamGenerateContent?alt=sse',{method:'POST',signal:sig,headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents})});if(!r.ok)await fail(r,'Gemini');return await readSSE(r,j=>j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join(''),on)}catch(e){if(e.name==='AbortError')throw e;err=e.message}}
  throw new Error(err)}
 const hasImg=img&&img.length,list=(hasImg?p.vision:p.models)||[];if(!list.length)throw new Error('ไม่รองรับรูปภาพ');
 const om=[{role:'system',content:sys}].concat(msgs.map((m,i)=>hasImg&&i===msgs.length-1?{role:'user',content:[{type:'text',text:m.content}].concat(img.map(u=>({type:'image_url',image_url:{url:u}})))}:m));
 for(const m of list){try{const r=await fetch(p.url,{method:'POST',signal:sig,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:m,messages:om,stream:true,max_tokens:4096})});if(!r.ok)await fail(r,p.n);return await readSSE(r,j=>j.choices?.[0]?.delta?.content,on)}catch(e){if(e.name==='AbortError')throw e;err=e.message}}
 throw new Error(err)}
async function ask(msgs,img,sig,on,sys){
 const sel=$('brain').value,all=Object.keys(P),order=sel==='auto'?all:[sel,...all.filter(x=>x!==sel)],errs=[];
 for(const id of order){if(!key(id)){if(id===sel)errs.push('ยังไม่ได้ใส่คีย์ '+P[id].n);continue}
  try{return await callProv(id,msgs,img,sig,on,sys)}catch(e){if(e.name==='AbortError')throw e;errs.push(P[id].n+': '+e.message)}}
 throw new Error(errs.join('\n')||'ยังไม่ได้ใส่คีย์ กดตั้งค่าที่เมนูซ้าย')}

const IMGX=/\.(png|jpe?g|gif|webp|bmp|avif)$/i;
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,1600/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85))};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('เปิดรูปไม่ได้'))};im.src=u})}
async function addFiles(list){const fs=[...(list||[])];for(const f of fs){if(pend.items.length>=8){toast('แนบได้ไม่เกิน 8 ไฟล์ต่อข้อความ');break}
 const it={name:f.name||'ไฟล์'};try{if((f.type||'').startsWith('image/')||IMGX.test(f.name)){it.imgs=[await shrink(f)]}else{const t=await f.text();it.text='\n\n[ไฟล์ '+f.name+']:\n'+t.slice(0,30000)}}catch(e){toast('อ่าน '+(f.name||'ไฟล์')+' ไม่ได้');continue}
 pend.items.push(it)}chips()}

function parseTool(text){if(!text)return null;const s=String(text).trim();try{const j=JSON.parse(s);if(j&&j.tool)return j}catch(e){}
 const m=s.match(/\{[\s\S]*\}/);if(m){try{const j=JSON.parse(m[0]);if(j&&j.tool)return j}catch(e){}}
 return null}
async function execTool(call){const name=call.tool,args=call.args||{};
 if(name==='search_web'){return await api('/api/search?q='+encodeURIComponent(args.query||'')+'&n=5')}
 if(name==='fetch_page'){return await api('/api/fetch?url='+encodeURIComponent(args.url||''))}
 if(name==='get_time'){return {ok:true,now:new Date().toString(),iso:new Date().toISOString(),locale:new Date().toLocaleString('th-TH')}}
 if(name==='remember'){
  if(args.kind==='profile'&&args.key){await updateMemory({profile:{[args.key]:args.value||args.text||''}});return {ok:true,remembered:'profile',key:args.key}}
  const kind=(args.kind==='preference'||args.kind==='note')?args.kind:'fact';
  await updateMemory({remember:{kind,text:args.text||args.value||'',source:'self'}});return {ok:true,remembered:kind,text:args.text||args.value||''}
 }
 return {ok:false,error:'unknown tool: '+name}}

async function maybeAutoRemember(userText,answer){if(!agentOn||!localBase())return;const t=userText||'';const cues=/(จำไว้|remember|ผมชื่อ|ฉันชื่อ|my name|เรียกฉัน|ชอบ|ไม่ชอบ|โปรเจกต์|เป้าหมาย)/i; if(!cues.test(t))return;
 const hint='สกัดข้อมูลที่ควรจำระยะยาวจากข้อความผู้ใช้ (ถ้ามี) ตอบเป็น JSON เดียวเท่านั้น: {"items":[{"kind":"fact|preference|profile","text":"...","key":"(ถ้า profile)","value":"(ถ้า profile)"}]} ถ้าไม่มีให้ตอบ {"items":[]}';
 try{const r=await ask([{role:'user',content:'ข้อความผู้ใช้: '+t+'\nคำตอบที่ให้: '+String(answer||'').slice(0,400)}],null,ctrl?ctrl.signal:null,()=>{},hint);
  const j=JSON.parse((r.match(/\{[\s\S]*\}/)||['{}'])[0]); const items=(j.items||[]).slice(0,4);
  for(const it of items){if(it.kind==='profile'&&it.key) await updateMemory({profile:{[it.key]:it.value||it.text||''}}); else if(it.text) await updateMemory({remember:{kind:it.kind==='preference'?'preference':'fact',text:it.text,source:'auto'}})}
 }catch(e){}}

async function runAgent(msgs,imgs,voice,bodyEl){
 const maxSteps=4; let finalText='';
 for(let step=0;step<maxSteps;step++){
  let out=''; const sys=sysPrompt(lastLang,voice,isCode(msgs[msgs.length-1]?.content||''));
  out=await ask(msgs,imgs,ctrl.signal,x=>{bodyEl.innerHTML=md(x);$('chat').scrollTop=1e9;if(voice)$('ovT').textContent=plain(x)},sys);
  const call=parseTool(out);
  if(!call || step===maxSteps-1){finalText=out;break}
  // execute tool
  if(voice)orb('think','กำลังใช้เครื่องมือ: '+call.tool);
  bodyEl.innerHTML=md(out+'\n\n_กำลังใช้เครื่องมือ: '+esc(call.tool)+'..._');
  let result; try{result=await execTool(call)}catch(e){result={ok:false,error:String(e.message||e)}}
  msgs=msgs.concat([{role:'assistant',content:JSON.stringify(call)},{role:'user',content:'ผลลัพธ์เครื่องมือ '+call.tool+': '+JSON.stringify(result).slice(0,6000)+'\n\nให้สรุป/ตอบผู้ใช้จากผลลัพธ์นี้ ถ้าข้อมูลยังไม่พอให้เรียกเครื่องมือที่เหมาะสมต่อ (JSON เดียว) มิฉะนั้นให้ตอบเป็นคำตอบสุดท้ายที่อ่านง่าย'}]);
  imgs=null; // only first step can carry images
 }
 return finalText||'(ไม่มีคำตอบ)'}

async function send(voice){
 if(busy){ctrl&&ctrl.abort();stopSpeak();return}
 const t=$('q').value.trim();if(!t&&!pend.items.length)return;
 let c=chats.find(x=>x.id===cur);if(!c){c={id:Date.now(),t:(t||pend.items[0].name||'แชทใหม่').slice(0,32),m:[]};chats.unshift(c);cur=c.id}
 const um={r:'user',c:t||'(แนบไฟล์)',x:pend.items.map(i=>i.text||'').join(''),f:pend.items.map(i=>i.name),imgs:pend.items.flatMap(i=>i.imgs||[])};um.img=um.imgs[um.imgs.length-1]||null;c.m.push(um);pend={items:[]};chips();$('q').value='';$('q').style.height='';
 view();lastLang=resolveLang(t);const ab=bubble({r:'assistant',c:'...'},true),body=ab.querySelector('.t');
 const hist=c.m.slice(-16),msgs=[];let left=24000;
 for(let i=hist.length-1;i>=0;i--){const m=hist[i];let x=m.x||'';if(x){if(x.length<=left)left-=x.length;else{x=x.slice(0,Math.max(0,left))+'\n...(ตัดเนื้อหาไฟล์)';left=0}}msgs[i]={role:m.r==='user'?'user':'assistant',content:(m.c||'')+x}}
 ctrl=new AbortController();setBusy(true);let reply='',ok=true;if(voice)orb('think');
 try{
  const local=localAns(t); if(local){reply=local}
  else if(agentOn){reply=await runAgent(msgs,um.imgs.length?um.imgs:null,voice,body)}
  else{reply=await ask(msgs,um.imgs.length?um.imgs:null,ctrl.signal,x=>{body.innerHTML=md(x);$('chat').scrollTop=1e9;if(voice)$('ovT').textContent=plain(x)},sysPrompt(lastLang,voice,isCode(t)))}
 }
 catch(e){ok=false;reply=e.name==='AbortError'?(reply||'(หยุดแล้ว)'):'เกิดข้อผิดพลาด:\n'+redact(e.message)}
 setBusy(false);c.m.push({r:'assistant',c:reply});save();view();
 if(ok) await maybeAutoRemember(t,reply);
 if(ok&&(voice||voiceOn)){const b=$('col').lastChild.querySelector('.spk');if(voice)orb('speak');await speak(reply,b)}
 else if(voice&&!ok){call=false;endCall()}}

// local quick answers
const WX=/(?:อากาศ|พยากรณ์|weather)\s*(?:ที่|ใน|ของ|at|in|for)?\s*([^\s?!.,]*)/i;
async function weather(city){try{const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=th&name='+encodeURIComponent(city))).json(),p=g.results&&g.results[0];if(!p)return 'ไม่พบสถานที่ชื่อ '+city;const w=await(await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&timezone=auto')).json(),c=w.current;return 'ตอนนี้ที่ '+p.name+' อุณหภูมิ '+Math.round(c.temperature_2m)+'°C รู้สึกเหมือน '+Math.round(c.apparent_temperature)+'°C ความชื้น '+c.relative_humidity_2m+'%'}catch(e){return 'ดูสภาพอากาศไม่ได้ในขณะนี้'}}
function localAns(t){const n=new Date(); if(/กี่โมง|เวลาเท่าไร|what time/i.test(t))return 'ขณะนี้เวลา '+n.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); if(/วันนี้วัน|วันที่เท่าไร|what.*date/i.test(t))return 'วันนี้ '+n.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); const m=t.match(/(?:ตั้งเวลา|จับเวลา|เตือน).*?(\d+)\s*(วินาที|นาที|ชั่วโมง)/); if(m){const s=+m[1]*({วินาที:1,นาที:60,ชั่วโมง:3600})[m[2]];setTimeout(()=>{lastLang='th';speak('ครบเวลา '+m[1]+' '+m[2]+' แล้ว')},s*1000);return 'ตั้งเวลา '+m[1]+' '+m[2]+' เรียบร้อยแล้ว'} const wm=t.match(WX); if(wm){/* async handled in agent/manual: keep simple */} return null}

// call mode
const WAKE=/(เฮ้|เฮ|ฮัลโหล|หวัดดี|hey|hi)?[\s,]*(ไซเฟอร์|zyphere|cypher|cipher)/i,BYE=/พอแล้ว|ไปก่อน|หยุดฟัง|standby|bye|goodbye/i,sleep=ms=>new Promise(r=>setTimeout(r,ms));
let mode=0,home=0; function ui(){const b=$('jvBtn');b.className='jv'+(mode&&home?' on':'');b.textContent=mode&&home?'● รอฟัง "ไซเฟอร์"':'ZYPHERE'}
function showOv(){$('ov').style.display='flex';orb('listen','')}function hideOv(){$('ov').style.display='none'}
async function handle(t){$('ovT').textContent=t;$('q').value=t;await send(true)}
async function say(t){lastLang='th';orb('speak',t);await speak(t)}
async function run(m){if(mode)return;mode=m;home=m===1?1:0;call=true;ui();if(m===2)showOv();let idle=0; while(mode&&call){if(mode===2)orb('listen');const t=await listenOnce();if(!mode||!call)break; if(!t){if(mode===2&&++idle>=3){if(!home)break;mode=1;hideOv();ui()}await sleep(250);continue}idle=0; if(mode===1){if(!WAKE.test(t))continue;mode=2;showOv();ui();const rest=t.replace(WAKE,'').replace(/^[\s,.]+/,'');if(rest.length>2)await handle(rest);else await say('ครับ มีอะไรให้ช่วย')} else if(BYE.test(t)){await say('รับทราบครับ ผมจะรออยู่ตรงนี้');if(!home)break;mode=1;hideOv();ui()} else await handle(t)} endCall()}
function endCall(){mode=0;home=0;call=false;stopListen();stopSpeak();if(ctrl&&busy)ctrl.abort();hideOv();ui()}

$('rate').oninput=function(){$('rv').textContent=this.value+'x'};$('rv').textContent=$('rate').value+'x';
$('testBtn').onclick=async()=>{lastLang='th';await speak('สวัสดีครับ ผมไซเฟอร์ พร้อมช่วยคุณแล้วครับ')};
$('agentBtn').classList.toggle('on',agentOn);
if(!key('groq')&&!key('gemini')&&!key('openrouter')&&!key('hf'))setTimeout(()=>$('setBtn').click(),400);
$('logo').innerHTML=lg()+'<span>Zyphere</span>';
loadMemory();view();
