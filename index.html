<script>
const $=id=>document.getElementById(id);
const getK=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lg=()=>'<svg class="lg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="url(#zg)"/><circle cx="32" cy="32" r="26" fill="url(#zs)"/><path d="M22 23h20L22 41h20" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><g class="or"><ellipse cx="32" cy="32" rx="30" ry="10.5" transform="rotate(-28 32 32)" fill="none" stroke="url(#zg)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="104 40"/></g></svg>';

let cur=null,pend={text:'',names:[],img:null},busy=false,ctrl=null,voiceOn=getK('zy_voice')!=='0',lastLang='th',call=false,curSR=null,stopRec=false;

$('sendBtn').innerHTML=IC.send;$('voiceBtn').innerHTML=voiceOn?IC.on:IC.off;

 groq:{n:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',models:['openai/gpt-oss-120b','llama-3.3-70b-versatile','llama-3.1-8b-instant','moonshotai/kimi-k2-instruct-0905'],vision:['meta-llama/llama-4-scout-17b-16e-instruct']},

 if(k){const parts=[{text:(src?'Edit this image as requested: ':'Generate an image: ')+desc}];if(src)parts.push({inline_data:{mime_type:src.split(';')[0].slice(5),data:src.split(',')[1]}});
  for(const m of ['gemini-2.5-flash-image','gemini-2.0-flash-preview-image-generation']){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',signal:sig,headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({contents:[{parts}],generationConfig:{responseModalities:['IMAGE','TEXT']}})});
   if(!r.ok){let j={};try{j=await r.json()}catch(e){}err=j.error?.message||'HTTP '+r.status;continue}
   const j=await r.json(),pt=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.inlineData||x.inline_data).find(Boolean);if(pt)return{text:src?'แต่งภาพเรียบร้อยครับท่าน':'เรียบร้อยครับท่าน นี่คือภาพที่ท่านต้องการ',pic:'data:'+(pt.mimeType||pt.mime_type||'image/png')+';base64,'+pt.data};err='โมเดลไม่ส่งภาพกลับมา'}catch(e){if(e.name==='AbortError')throw e;err=e.message}}}
 if(src)return{text:'แต่งภาพไม่สำเร็จครับท่าน ('+(err||'ยังไม่ได้ใส่คีย์ Gemini')+') การแต่งภาพต้องใช้คีย์ Gemini ที่เปิดใช้โมเดลสร้างภาพได้'};
 let p=desc;try{st&&st('กำลังเรียบเรียงคำสั่งวาดภาพ...');p=await ask([{role:'user',content:desc}],null,sig,()=>{},'Rewrite the user request as one vivid, detailed English image-generation prompt. Output only the prompt.')}catch(e){if(e.name==='AbortError')throw e}
 const u='https://image.pollinations.ai/prompt/'+encodeURIComponent(p.slice(0,500))+'?width=1024&height=1024&nologo=true&seed='+Math.floor(Math.random()*1e6);st&&st('กำลังวาดภาพ...');
 if(await preload(u))return{text:'เรียบร้อยครับท่าน นี่คือภาพที่ท่านต้องการ',pic:u};
 return{text:'วาดภาพไม่สำเร็จครับท่าน'+(err?' (Gemini: '+err+')':'')+' ตัวสำรองฟรีอาจใช้ไม่ได้ชั่วคราว ลองใหม่หรือใส่คีย์ Gemini'}}
async function extras(t,um,sig,st){let m;const L=local(t);if(L)return{text:L};
 if((m=t.match(WX))){const city=(m[1]||'').replace(/(ตอนนี้|วันนี้|พรุ่งนี้|เป็น.*|ดีไหม.*|หน่อย|ครับ|ค่ะ|บ้าง|เท่าไร|ยังไง|เมื่อไร|now|today).*$/i,'').trim();if(!city||STOP.test(city))return{text:'ท่านต้องการทราบอากาศที่จังหวัดไหนครับ'};st&&st('กำลังดูสภาพอากาศ...');return{text:await weather(city)}}
 if(um.img&&EDIT.test(t)){st&&st('กำลังแต่งภาพ...');return await genImg(t,um.img,sig,st)}
 if((m=t.match(IMG))){st&&st('กำลังวาดภาพ...');return await genImg(m[1],null,sig,st)}
 return null}
async function send(voice){
 if(busy){ctrl&&ctrl.abort();stopSpeak();return}
 const t=$('q').value.trim();if(!t&&!pend.names.length)return;
 let c=chats.find(x=>x.id===cur);if(!c){c={id:Date.now(),t:(t||pend.names[0]).slice(0,32),m:[]};chats.unshift(c);cur=c.id}
 const um={r:'user',c:t||'(แนบไฟล์)',x:pend.text,f:pend.names.slice(),img:pend.img};c.m.push(um);pend={text:'',names:[],img:null};chips();$('q').value='';$('q').style.height='';
 view();const lang=resolveLang(t);lastLang=lang;const ab=bubble({r:'assistant',c:'...'},true),body=ab.querySelector('.t');
 const msgs=c.m.slice(-20).map(m=>({role:m.r==='user'?'user':'assistant',content:m.c+(m.x||'')}));
 ctrl=new AbortController();setBusy(true);let reply='',pic='',ok=true;if(voice)orb('think');
 try{const ex=await extras(t,um,ctrl.signal,s=>{body.innerHTML='<span class="dots"><i></i><i></i><i></i></span> '+esc(s)});
  if(ex){reply=ex.text;pic=ex.pic||''}else reply=await ask(msgs,um.img,ctrl.signal,x=>{reply=x;body.innerHTML=md(x);$('chat').scrollTop=1e9;if(voice)$('ovT').textContent=plain(x)},sysPrompt(lang,voice))}
 catch(e){ok=false;reply=e.name==='AbortError'?(reply||'(หยุดแล้ว)'):'เกิดข้อผิดพลาด:\n'+e.message}
 setBusy(false);c.m.push({r:'assistant',c:reply,pic});save();view();
 if(ok&&(voice||voiceOn)){const b=$('col').lastChild.querySelector('.spk');if(voice)orb('speak');await speak(reply,b)}
 else if(voice&&!ok){call=false;endCall()}}
function listenOnce(){stopRec=false;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR)return new Promise(res=>{const r=new SR(),l=$('lang').value;curSR=r;r.lang=l==='en'?'en-US':'th-TH';let got='';r.onresult=e=>{got=e.results[0][0].transcript};r.onerror=e=>{if(/not-allowed|service-not/.test(e.error)){alert('ต้องอนุญาตให้ใช้ไมค์ก่อน');call=false}};r.onend=()=>res(got);try{r.start()}catch(e){res('')}});
 return recordOnce()}
async function recordOnce(){const k=key('groq');if(!k){alert('เบราว์เซอร์นี้ไม่มีระบบฟังเสียงในตัว (เช่น Firefox) ใส่คีย์ Groq ในตั้งค่า หรือใช้ Chrome/Edge');call=false;return ''}
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('ต้องอนุญาตให้ใช้ไมค์ก่อน');call=false;return ''}
 const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(st).connect(an);const buf=new Uint8Array(an.fftSize),mr=new MediaRecorder(st),ch=[];mr.ondataavailable=e=>ch.push(e.data);const stopped=new Promise(r=>mr.onstop=r);mr.start();
 let spoke=false,last=Date.now();const t0=last;
 await new Promise(res=>{const iv=setInterval(()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));const n=Date.now();if(m>14){spoke=true;last=n}if(stopRec||(spoke&&n-last>1300)||n-t0>30000||(!spoke&&n-t0>9000)){clearInterval(iv);res()}},100)});
 mr.stop();await stopped;st.getTracks().forEach(t=>t.stop());ac.close();if(!spoke||stopRec)return '';
 const fd=new FormData();fd.append('file',new Blob(ch,{type:mr.mimeType}),'a.webm');fd.append('model','whisper-large-v3-turbo');const l=$('lang').value;if(l!=='auto')fd.append('language',l);
 try{const r=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+k},body:fd});const j=await r.json();return (j.text||'').trim()}catch(e){return ''}}
function stopListen(){stopRec=true;try{curSR&&curSR.abort()}catch(e){}}
async function mic(){if(busy||call)return;const b=$('micBtn');b.style.color='#ef4444';const t=await listenOnce();b.style.color='';if(t){$('q').value=t;send()}}
const WAKE=/(เฮ้|เฮ|ฮัลโหล|หวัดดี|hey|hi)?[\s,]*(ไซเฟอร์|ไซเฟอ|ไซเฟ่อร์|ไซเฟ่อ|ไซเฟิร์|ไซเฟอะ|ซายเฟอร์|ไซเฟล|ไซแฟอร์|ซิเฟอร์|zyphere|zypher|zyfer|cypher|cipher|sypher|xypher)/i,BYE=/พอแล้ว|ไปก่อน|แค่นี้|หยุดฟัง|สแตนด์บาย|standby|goodbye|bye/i,sleep=ms=>new Promise(r=>setTimeout(r,ms));
let mode=0,home=0;
function ui(){const b=$('jvBtn');b.className='jv'+(mode&&home?' on':'');b.textContent=mode&&home?'● รอฟัง "ไซเฟอร์"':'ZYPHERE'}
function showOv(){$('ov').style.display='flex';orb('listen','')}function hideOv(){$('ov').style.display='none'}
function local(t){let m;const n=new Date();
 if(/กี่โมง|เวลาเท่าไร|what time/i.test(t))return 'ขณะนี้เวลา '+n.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' นาฬิกาครับท่าน';
 if(/วันนี้วัน|วันที่เท่าไร|what.*date/i.test(t))return 'วันนี้'+n.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'ครับท่าน';
 if((m=t.match(/(?:ตั้งเวลา|จับเวลา|เตือน).*?(\d+)\s*(วินาที|นาที|ชั่วโมง)/))){const s=+m[1]*({วินาที:1,นาที:60,ชั่วโมง:3600})[m[2]];setTimeout(()=>{lastLang='th';speak('ครบเวลา '+m[1]+' '+m[2]+'แล้วครับท่าน')},s*1000);return 'รับทราบครับท่าน ตั้งเวลา '+m[1]+' '+m[2]+'เรียบร้อย'}
 return null}
function addLocal(u,r){let c=chats.find(x=>x.id===cur);if(!c){c={id:Date.now(),t:u.slice(0,32),m:[]};chats.unshift(c);cur=c.id}c.m.push({r:'user',c:u},{r:'assistant',c:r});save();view()}
async function handle(t){$('ovT').textContent=t;$('q').value=t;await send(true)}
async function say(t){lastLang='th';orb('speak',t);await speak(t)}
async function run(m){if(mode)return;mode=m;home=m===1?1:0;call=true;ui();if(m===2)showOv();let idle=0;
 while(mode&&call){if(mode===2)orb('listen');const t=await listenOnce();if(!mode||!call)break;
  if(!t){if(mode===2&&++idle>=3){if(!home)break;mode=1;hideOv();ui()}await sleep(250);continue}idle=0;
  if(mode===1){if(!WAKE.test(t))continue;mode=2;showOv();ui();const rest=t.replace(WAKE,'').replace(/^[\s,.]+/,'');if(rest.length>2)await handle(rest);else await say('ครับท่าน มีอะไรให้ผมรับใช้ครับ')}
  else if(BYE.test(t)){await say('รับทราบครับท่าน ผมจะรออยู่ตรงนี้');if(!home)break;mode=1;hideOv();ui()}
  else await handle(t)}
 endCall()}
function endCall(){mode=0;home=0;call=false;stopListen();stopSpeak();if(ctrl&&busy)ctrl.abort();hideOv();ui()}
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('q').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,150)+'px'});
$('sendBtn').onclick=()=>send();$('micBtn').onclick=mic;$('callBtn').onclick=()=>run(2);$('jvBtn').onclick=()=>mode?endCall():run(1);$('endBtn').onclick=endCall;$('plusBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=function(){addFile(this.files[0]);this.value=''};
$('voiceBtn').onclick=()=>{voiceOn=!voiceOn;setK('zy_voice',voiceOn?'1':'0');$('voiceBtn').innerHTML=voiceOn?IC.on:IC.off;if(!voiceOn)stopSpeak()};
$('webBtn').classList.toggle('on',webOn);$('webBtn').onclick=()=>{if(!key('gemini')){toast('ค้นเว็บต้องใช้คีย์ Gemini ใส่ได้ในตั้งค่า');return}webOn=!webOn;setK('zy_web',webOn?'1':'0');$('webBtn').classList.toggle('on',webOn);toast(webOn?'เปิดค้นเว็บแล้ว (ใช้ Google Search ผ่าน Gemini)':'ปิดค้นเว็บแล้ว')};
$('newBtn').onclick=()=>{cur=null;view();$('side').classList.remove('open');$('q').focus()};$('search').oninput=renderList;
$('menu').onclick=()=>$('side').classList.toggle('open');
document.addEventListener('paste',e=>{const it=[...(e.clipboardData||{}).items||[]].find(i=>i.kind==='file');if(it){e.preventDefault();addFile(it.getAsFile())}});
$('chat').addEventListener('dragover',e=>e.preventDefault());$('chat').addEventListener('drop',e=>{e.preventDefault();addFile(e.dataTransfer.files[0])});
$('setBtn').onclick=()=>{['groq','gemini','openrouter','hf'].forEach(id=>{const el=$('k-'+id);el.value=key(id);el.oninput=()=>setK('zyphere_'+id+'_key',el.value.trim())});
 $('custom').value=getK('zy_custom');$('custom').oninput=function(){setK('zy_custom',this.value)};$('brain').onchange=function(){setK('zy_brain',this.value)};$('lang').onchange=function(){setK('zy_lang',this.value)};
 $('rate').oninput=function(){setK('zy_rate',this.value);$('rv').textContent=this.value+'x'};$('rv').textContent=$('rate').value+'x';$('set').style.display='flex'};
$('doneBtn').onclick=()=>$('set').style.display='none';$('set').onclick=e=>{if(e.target===$('set'))$('set').style.display='none'};
$('wipeBtn').onclick=()=>{if(confirm('ลบแชททั้งหมด?')){chats=[];cur=null;save();view()}};
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
if(!key('groq')&&!key('gemini')&&!key('openrouter')&&!key('hf'))setTimeout(()=>$('setBtn').click(),400);
$('persona').value=getK('zy_persona')==='friend'?'friend':'zyphere';$('persona').onchange=function(){setK('zy_persona',this.value)};
$('ttse').value=getK('zy_ttse')||'g';$('ttse').onchange=function(){setK('zy_ttse',this.value)};$('ttsv').value=getK('zy_ttsv')||'Charon';$('ttsv').onchange=function(){setK('zy_ttsv',this.value)};
$('testBtn').onclick=async()=>{lastLang='th';await speak('สวัสดีครับท่าน ระบบเสียงพร้อมใช้งานแล้วครับ');if(eng)toast('เล่นเสียงได้ด้วย: '+eng)};
$('ttsurl').value=getK('zy_ttsurl');$('ttsurl').oninput=function(){setK('zy_ttsurl',this.value.trim())};
$('logo').innerHTML=lg()+'<span>Zyphere</span>';
view();
</script></body></html>
