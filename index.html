<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyphere</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#fff;display:flex;height:100vh}.side{width:230px;border-right:1px solid #eee;padding:14px}.side div{padding:9px;border-radius:8px}.main{flex:1;display:flex;flex-direction:column;max-width:900px;margin:0 auto;width:100%}.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.b{max-width:80%;padding:12px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.6}.u{align-self:flex-end;background:#0084ff;color:#fff}.a{align-self:flex-start;background:#f0f2f5}.box{padding:14px;display:flex;gap:8px;border-top:1px solid #eee;align-items:center}.box input{flex:1;padding:13px 16px;border-radius:999px;border:1px solid #ddd;outline:none;font-size:15px}.box select{padding:10px;border-radius:999px}.send{width:48px;height:48px;border-radius:50%;border:0;background:#0084ff;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}.mini{width:44px;height:44px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:18px;cursor:pointer;flex-shrink:0}.ok{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}.card{background:#fff;width:520px;max-width:92vw;border-radius:16px;padding:20px}.card input{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;margin:5px 0}</style></head><body>
<div class="side"><b style="font-size:22px">✦ Zyphere</b><div>✎ แชทใหม่</div><div>⌕ ค้นหา</div><div>⊞ สื่อ</div><div style="margin-top:420px;border-top:1px solid #eee;padding-top:10px"><button onclick="openS()" style="width:100%;text-align:left;padding:10px;border:0;background:#fff;cursor:pointer">⚙ ตั้งค่า - ใส่คีย์</button><div style="padding:8px;font-weight:bold">W Whisp</div></div></div>
<div class="main"><div style="padding:12px;text-align:right;color:#888;font-size:12px">Zyphere COMPLETE 2 • แก้โมเดล Gemini + OpenRouter + HF แล้ว</div><div class="chat" id="chat"><div class="b a">สวัสดีครับ ผม Zyphere 4 สมองฟรีใช้ได้ครบแล้ว พิมพ์ กดไมค์ หรือกด + แนบไฟล์ได้เลย</div></div>
<div class="box"><select id="brain"><option value="groq">Groq ฟรี (gsk_)</option><option value="gemini">Gemini ฟรี (AQ.)</option><option value="openrouter">OpenRouter ฟรี</option><option value="hf">Hugging Face ฟรี</option></select><input id="q" placeholder="ถาม Zyphere..." autocomplete="off"><button class="mini" id="plusBtn" type="button" title="แนบไฟล์">+</button><input type="file" id="fileIn" style="display:none"><button class="mini" id="micBtn" type="button" title="พูด">🎤</button><button class="mini" id="voiceBtn" type="button" title="เปิด/ปิดเสียง">🔊</button><button class="send" id="sendBtn" type="button">↑</button></div></div>
<div class="ok" id="set"><div class="card"><h3 style="margin:0">ตั้งค่า - ใส่คีย์ฟรี</h3><p style="font-size:13px;color:#666">ใส่ช่องเดียวก็พอ</p>Groq (gsk_)<input id="k-groq" autocomplete="off">Gemini (AQ.)<input id="k-gemini" autocomplete="off">OpenRouter (sk-or-v1-)<input id="k-openrouter" autocomplete="off">Hugging Face (hf_)<input id="k-hf" autocomplete="off"><br><button onclick="closeS()" style="padding:10px 16px;background:#16a34a;color:#fff;border:0;border-radius:10px;cursor:pointer">เสร็จแล้ว - ปิด</button></div></div>
<script>
function getK(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function openS(){var m={'k-groq':'zyphere_groq_key','k-gemini':'zyphere_gemini_key','k-openrouter':'zyphere_openrouter_key','k-hf':'zyphere_hf_key'};Object.keys(m).forEach(function(id){document.getElementById(id).value=getK(m[id]);document.getElementById(id).oninput=function(){try{localStorage.setItem(m[id],this.value.trim())}catch(e){}}});document.getElementById('set').style.display='flex';}
function closeS(){document.getElementById('set').style.display='none';}
function clean(t){if(!t)return t;return t.replace(/\*\*|__|#{1,6}|```/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s{2,}/g,' ').trim();}
function addMsg(t,cls){var d=document.createElement('div');d.className='b '+cls;d.textContent=t;document.getElementById('chat').appendChild(d);document.getElementById('chat').scrollTop=99999;return d;}
let voiceOn=true;
function speakText(txt,btn){try{if(!voiceOn)return;if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='th-TH';u.rate=1;u.pitch=0.85;let vs=window.speechSynthesis.getVoices();let th=vs.find(v=>v.lang&&v.lang.startsWith('th'));if(th)u.voice=th;u.onend=()=>{if(btn)btn.textContent='▶';};if(btn)btn.textContent='⏹';window.speechSynthesis.speak(u);}catch(e){}}
function toggleVoice(){voiceOn=!voiceOn;let b=document.getElementById('voiceBtn');if(b)b.textContent=voiceOn?'🔊':'🔇';if(!voiceOn&&window.speechSynthesis)window.speechSynthesis.cancel();}
function startListen(){try{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('เบราว์เซอร์นี้ไม่รองรับไมค์ ให้พิมพ์แทน');return;}let r=new SR();r.lang='th-TH';let b=document.getElementById('micBtn');if(b)b.textContent='🔴';r.onresult=(e)=>{let t=e.results[0][0].transcript;document.getElementById('q').value=t;if(b)b.textContent='🎤';send();};r.onerror=()=>{if(b)b.textContent='🎤';};r.onend=()=>{if(b)b.textContent='🎤';};r.start();}catch(e){alert('เปิดไมค์ไม่ได้: '+e.message);}}
async function callAI(text,brain){
 if(brain==='groq'){var k=getK('zyphere_groq_key');if(!k)throw new Error('ยังไม่ได้ใส่ Groq Key - กด ตั้งค่า ใส่ gsk_');var models=['openai/gpt-oss-120b','llama-3.1-8b-instant','moonshotai/kimi-k2-instruct-0905'];var lastErr='';for(var mi=0;mi<models.length;mi++){try{var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:models[mi],messages:[{role:'user',content:text}]})});var j=await r.json();if(r.ok&&j.choices)return j.choices[0].message.content;lastErr=(j.error&&j.error.message)||('Groq '+r.status);}catch(e){lastErr=e.message;}}throw new Error('Groq: '+lastErr);}
 if(brain==='gemini'){var k2=getK('zyphere_gemini_key');if(!k2)throw new Error('ยังไม่ได้ใส่ Gemini Key - กด ตั้งค่า ใส่ AQ.');var gmodels=['gemini-3.8-flash','gemini-2.5-flash','gemini-2.0-flash'];var gerr='';for(var gi=0;gi<gmodels.length;gi++){for(var gv=0;gv<2;gv++){var ver=gv===0?'v1beta':'v1';try{var r2=await fetch('https://generativelanguage.googleapis.com/'+ver+'/models/'+gmodels[gi]+':generateContent?key='+k2,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:text}]}]})});var j2=await r2.json();if(r2.ok&&j2.candidates)return j2.candidates[0].content.parts[0].text;gerr=(j2.error&&j2.error.message)||('Gemini '+r2.status);}catch(e){gerr=e.message;}}}throw new Error('Gemini: '+gerr);}
 if(brain==='openrouter'){var k3=getK('zyphere_openrouter_key');if(!k3)throw new Error('ยังไม่ได้ใส่ OpenRouter Key');var omodels=['deepseek/deepseek-chat-v3.1:free','google/gemma-3-27b-it:free','qwen/qwen3-235b-a22b:free','meta-llama/llama-3.3-70b-instruct:free'];var oerr='';for(var oi=0;oi<omodels.length;oi++){try{var r3=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k3},body:JSON.stringify({model:omodels[oi],messages:[{role:'user',content:text}]})});var j3=await r3.json();if(r3.ok&&j3.choices)return j3.choices[0].message.content;oerr=(j3.error&&j3.error.message)||('OpenRouter '+r3.status);}catch(e){oerr=e.message;}}throw new Error('OpenRouter: '+oerr);}
 if(brain==='hf'){var k4=getK('zyphere_hf_key');if(!k4)throw new Error('ยังไม่ได้ใส่ HF Key');var herr='';var hmodels=['meta-llama/Meta-Llama-3-8B-Instruct','Qwen/Qwen2.5-7B-Instruct'];for(var hi=0;hi<hmodels.length;hi++){try{var r4=await fetch('https://router.huggingface.co/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k4},body:JSON.stringify({model:hmodels[hi],messages:[{role:'user',content:text}],max_tokens:1000})});var j4=await r4.json();if(r4.ok&&j4.choices)return j4.choices[0].message.content;herr=(j4.error&&j4.error.message)||('HF '+r4.status);}catch(e){herr=e.message;}}throw new Error('HF: '+herr);}
}
async function send(){var q=document.getElementById('q');var t=q.value.trim();if(!t)return;q.value='';addMsg(t,'u');var b=addMsg('กำลังคิด...','a');try{var ans=await callAI(t,document.getElementById('brain').value);let txt=clean(ans);b.textContent='';let sp=document.createElement('span');sp.textContent=txt;let pb=document.createElement('button');pb.textContent='▶';pb.title='ฟังเสียง';pb.style.cssText='margin-left:8px;border:1px solid #ddd;background:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:12px';pb.onclick=()=>{if(window.speechSynthesis&&window.speechSynthesis.speaking){window.speechSynthesis.cancel();pb.textContent='▶';return;}speakText(txt,pb);};b.appendChild(sp);b.appendChild(pb);if(voiceOn)setTimeout(()=>speakText(txt,pb),300);}catch(e){b.textContent='เกิดข้อผิดพลาด: '+e.message;}}
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();send();}});
document.getElementById('sendBtn').addEventListener('click',function(){send();});
document.getElementById('micBtn').addEventListener('click',function(){startListen();});
document.getElementById('voiceBtn').addEventListener('click',function(){toggleVoice();});
document.getElementById('plusBtn').addEventListener('click',function(){document.getElementById('fileIn').click();});
document.getElementById('fileIn').addEventListener('change',function(){let f=this.files[0];if(!f)return;let q=document.getElementById('q');q.value=(q.value+' [ไฟล์: '+f.name+'] ').trim();this.value='';});
</script></body></html>
