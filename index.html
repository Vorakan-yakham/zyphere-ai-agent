  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes blink{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0)
  }

  40%{
    opacity:1;
    transform:translateY(-3px)
  }
}

2. ภาพมุมใกล้ของสิ่งของประจำวัน + แคปชันสั้น
3. ภาพเปรียบเทียบก่อน/หลัง พร้อมเลข 3 ข้อ

1. เลือกงานสำคัญที่สุด 1 อย่าง แล้วเริ่มด้วยเวลา 25 นาที
2. ตอบข้อความค้างให้ครบ แล้วปิดแจ้งเตือนช่วงโฟกัส
3. สรุปผลตอนเย็น 3 บรรทัด: ทำได้ / ค้างอยู่ / พรุ่งนี้ทำต่อ

ถ้าบอกชื่องานมา ฉันจะช่วยแตกเป็นขั้นตอนย่อยให้เลย`;if(l.includes("ค้นพบ")||l.includes("น่าสนใจ"))return`ค้นพบสำหรับวันนี้

• ลองถามคำถามที่ยังไม่มีคำตอบ แล้วให้ Zyphere ช่วยร่างคำตอบแรก
• เปลี่ยนงานซ้ำๆ ให้เป็นเช็กลิสต์ แล้วเก็บไว้ใช้ซ้ำ
• เลือกหัวข้อเดียว แล้วสรุปสิ่งที่ได้เรียนรู้ใน 3 ประโยค

วันนี้เริ่มจากก้าวเล็กๆ
ไม่ต้องสมบูรณ์แบบ แค่ขยับไปข้างหน้า

3 สิ่งที่จะทำวันนี้:
— โฟกัสงานเดียวให้จบ
— พักให้พอ
— สรุปสิ่งที่เรียนรู้
