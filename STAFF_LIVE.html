<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyphere — Admin Staff Live</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07131c;--panel:#0d2733;--acc:#22d3ee;--ink:#e8f6fa;--mut:#8fb3c0;--ok:#34d399;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',sans-serif}
header{padding:22px 26px;border-bottom:1px solid #17333f;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:22px;letter-spacing:1px}.live{color:#07131c;background:var(--ok);padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.5}}
main{max-width:1400px;margin:auto;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--panel);border:1px solid #1b3a48;border-radius:14px;padding:16px}
.k b{display:block;font-size:30px;color:var(--acc)}.k span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 380px;gap:18px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid #1b3a48;border-radius:14px;padding:14px;position:relative;overflow:hidden}
.card.live{border-color:var(--ok)}.card .dot{position:absolute;right:12px;top:12px;width:9px;height:9px;border-radius:50%;background:#45606b}
.card.live .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.card h3{margin:0 0 4px;font-size:14px}.card .m{font-size:11px;color:var(--mut)}
.card .v{font-size:24px;font-weight:700;margin:8px 0 0}.card .s{font-size:10px;color:var(--warn)}
.feed{background:var(--panel);border:1px solid #1b3a48;border-radius:14px;padding:16px;height:640px;overflow:auto}
.feed h2{margin:0 0 12px;font-size:15px;color:var(--acc)}
.ev{border-left:2px solid var(--acc);padding:6px 10px;margin:8px 0;font-size:12px;background:#0a1e28;border-radius:6px}
.ev b{color:var(--acc)}.ev small{display:block;color:var(--mut);margin-top:2px}
.err{background:#3a1414;color:#ffb4b4;padding:20px;border-radius:12px}
a{color:var(--acc)}</style></head><body>
<header><h1>🛰️ ZYPHERE · ADMIN — STAFF LIVE</h1>
<div><span class="live" id="liveBadge">LIVE</span> <span id="who" style="color:var(--acc);font-size:12px;margin-right:10px"></span><span id="clock" style="color:var(--mut);font-size:12px"></span></div></header>
<main>
<div id="gate" class="err" style="display:none">เฉพาะ Admin — <a href="./">เข้าสู่ระบบ</a> ก่อนครับ</div>
<div id="app">
<div class="kpis" id="kpis"></div>
<div class="grid"><div class="staff" id="staff"></div><div class="feed" id="feed"></div></div>
</div></main>
<script>
const BK='https://zyphere-ai-agent.onrender.com';
const TK=()=>{try{return localStorage.getItem('zy_token')||''}catch(e){return ''}};
async function load(){
 if(!TK()){document.getElementById('app').style.display='none';document.getElementById('gate').style.display='block';return}
 try{
  const me=await(await fetch(BK+'/api/store/me?token='+encodeURIComponent(TK()))).json();
  if(!me.ok||!me.me.is_owner){document.getElementById('app').style.display='none';document.getElementById('gate').style.display='block';return}
  document.getElementById('who').textContent='บัญชี: '+(me.me.email||'-');
  const r=await fetch(BK+'/api/admin/staff/live?token='+encodeURIComponent(TK()));const d=await r.json();
  if(!d.ok)throw new Error(d.error||'forbidden');
  const K=d.kpis;
  document.getElementById('kpis').innerHTML=[
   ['แผนก',K.departments],['ทำงานอยู่',K.active],[' live ตอนนี้',K.live_now],
   ['รอบลีก',K.league_rounds],['รอบรายได้',K.revenue_cycles],['ช่องทาง',K.revenue_channels],
   ['QA','ผ่าน']
  ].map(x=>'<div class="k"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
  document.getElementById('staff').innerHTML=(d.staff||[]).map(s=>
   '<div class="card '+(s.live?'live':'')+'"><div class="dot"></div>'+
   '<h3>'+s.name+'</h3><div class="m">'+s.metric+'</div>'+
   '<div class="v">'+s.value+'</div><div class="s">'+
   (s.live?'● กำลังทำงาน':'○ ล่าสุด '+(s.last_seen_hours||0)+' ชม.ที่แล้ว')+'</div></div>').join('');
  document.getElementById('feed').innerHTML='<h2>เส้นเวลากิจกรรม · กิจกรรมล่าสุด</h2>'+
   (d.feed||[]).map(e=>'<div class="ev"><b>'+e.who+'</b> — '+e.text+
    '<small>'+new Date(e.t*1000).toLocaleTimeString('th-TH')+'</small></div>').join('');
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('th-TH');
 }catch(e){document.getElementById('feed').innerHTML='<div class="err">'+e.message+'</div>'}
}
load();setInterval(load,5000);
</script></body></html>
