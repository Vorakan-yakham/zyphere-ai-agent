name: Zyphere Always-On Development

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  develop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: ALL DEPARTMENTS — learn, create, improve, verify
        run: |
          python - <<'PY'
          import json, traceback
          import time as _t
          steps = [
            ("ebook", "ebook_design_team", "run"),
            ("ebook_editor", "ebook_editor_gate", "run"),
            ("differentiation", "differentiation_lab", "run"),
            ("council_briefing", "council_briefing", "run"),
            ("thai_language", "thai_language_brain", "build"),
            ("world", "knowledge_engine", "run"),
            ("solver", "world_solver", "run"),
            ("devices", "device_bridge", "auto_product"),
            ("knowledge", "knowledge_engine", "run"),
            ("disciplines", "discipline_lab", "propose"),
            ("brain", "own_brain", "grow"),
            ("imagination", "imagination_engine", "run"),
            ("media", "media_twin_track", "run"),
            ("nudge", "nudge_lazy", "run"),
            ("commerce", "commerce_lab", "run"),
            ("differentiation", "differentiation_lab", "run"),
            ("qa", "qa_audit_team", "run"),
          ]
          out = {}
          for name, mod, fn in steps:
            try:
              m = __import__(mod)
              r = getattr(m, fn)()
              try:
                  json.dumps(r)
                  safe = r
              except TypeError:
                  def _clean(v):
                      if isinstance(v, dict): return {str(k): _clean(x) for k,x in v.items()}
                      if isinstance(v, (list, tuple)): return [_clean(x) for x in v]
                      if isinstance(v, (str,int,float,bool)) or v is None: return v
                      return str(v)[:180]
                  safe = _clean(r)
              r = safe
              out[name] = {"ok": bool(r.get("ok", True)),
                           "summary": {k: r.get(k) for k in
                                       ("topics", "facts", "count", "round", "status",
                                        "keep", "fix", "idle", "sources") if k in r}}
            except Exception as e:
              out[name] = {"ok": False, "error": str(e)[:160]}
              traceback.print_exc()
          # Owner wants ~1-minute pulses. GitHub cron minimum is 5 min, so
          # run five sub-cycles inside this job (~every 60 seconds).
          for cycle in range(5):
              for name, mod, fn in [("ebook", "ebook_design_team", "run"),
                                    ("editor", "ebook_editor_gate", "run"),
                                    ("diff", "differentiation_lab", "run")]:
                  try:
                      m = __import__(mod)
                      r = getattr(m, fn)()
                      out[name + "_pulse" + str(cycle+1)] = {
                          "ok": bool(r.get("ok")),
                          "fix": r.get("fix"), "keep": r.get("keep")}
                  except Exception as e:
                      out[name + "_pulse" + str(cycle+1)] = {"ok": False,
                                                             "error": str(e)[:120]}
              if cycle < 4:
                  _t.sleep(12)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          open("data/autonomy_last.json", "w", encoding="utf-8").write(
              json.dumps(out, ensure_ascii=False, indent=2))
          import datetime
          lines = ["# Zyphere ทำงานเองโดยไม่มีผู้ใช้สั่ง", "",
                   "เวลา: " + datetime.datetime.utcnow().isoformat() + "Z",
                   "รันโดย: GitHub Actions autonomy.yml (cron ทุก 30 นาที)", "",
                   "| ฝ่าย | ผลที่เกิดจริง |", "|---|---|"]
          for name, r in out.items():
              lines.append("| %s | %s |" % (name, json.dumps(r, ensure_ascii=False)[:220]))
          lines += ["", "ถ้าฝ่ายไหนมี error ระบบจะเรียนรู้แล้วพยายามแก้ในรอบถัดไป", ""]
          open("governance/AUTONOMY_LIVE.md", "w", encoding="utf-8").write("\n".join(lines))
          PY
      - name: Publish artefacts and report
        run: |
          git config user.name "Zyphere Autonomy"
          git config user.email "zyphere@users.noreply.github.com"
          git add -A
          git commit -m "Autonomy: all departments learn and develop (unattended)" || true
          git pull --rebase origin main || true
          git push || true
