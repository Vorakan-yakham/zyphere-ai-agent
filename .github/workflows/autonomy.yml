name: Zyphere Always-On Development

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: zypher-autonomy
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: ALL DEPARTMENTS — learn, create, improve, verify
        run: |
          python - <<'PY'
          import json, traceback
          import time as _t
          steps = [
            ("next", "next_development", "run"),
            ("reasoning", "reasoning_engine", "run"),
            ("pagefix", "page_auto_fixer", "run"),
            ("outreach", "outreach_engine", "run"),
            ("selfnudge", "self_nudge", "run"),
            ("league", "improvement_league", "run"),
            ("freepool", "free_image_sources", "run"),
            ("difflab", "diffusion_like", "run"),
            ("covers", "cover_designer", "run"),
            ("coverpub", "cover_publisher", "run"),
            ("store_audit", "storefront_rebuild", "run"),
            ("roadmap", "future_roadmap", "run"),
            ("wish", "wish_cycle", "run"),
            ("revenue_auto", "revenue_autopilot", "run"),
            ("samples", "sample_publisher", "run"),
            ("typeset", "book_typesetter", "run"),
            ("ebook_complete", "ebook_complete", "run"),
            ("ebook", "ebook_design_team", "run"),
            ("ebook_editor", "ebook_editor_gate", "run"),
            ("differentiation", "differentiation_lab", "run"),
            ("council_briefing", "council_briefing", "run"),
            ("thai_language", "thai_language_brain", "build"),
            ("world", "knowledge_engine", "run"),
            ("solver", "world_solver", "run"),
            ("devices", "device_bridge", "auto_product"),
            ("knowledge", "knowledge_engine", "run"),
            ("disciplines", "discipline_lab", "propose"),
            ("brain", "own_brain", "grow"),
            ("imagination", "imagination_engine", "run"),
            ("media", "media_twin_track", "run"),
            ("nudge", "nudge_lazy", "run"),
            ("commerce", "commerce_lab", "run"),
            ("value", "book_value_fixer", "run"),
            ("differentiation", "differentiation_lab", "run"),
            ("uiaudit", "ui_functional_audit", "run"),
            ("storetest", "store_access_test", "run"),
            ("progress", "department_progress", "run"),
            ("design", "system_design", "run"),
            ("it_review", "it_integration_review", "run"),
            ("security", "security_audit", "run"),
            ("qa", "qa_audit_team", "run"),
            ("jarvis", "jarvis_directive", "run"),
            ("learner", "global_code_learner", "run"),
            ("radar", "tech_radar", "run"),
            ("modernize", "book_modernizer", "run"),
          ]
          from concurrent.futures import ThreadPoolExecutor
          out = {}
          def _run(item):
              name, mod, fn = item
              try:
                m = __import__(mod)
                r = getattr(m, fn)()
                return name, r
              except Exception as e:
                return name, {"ok": False, "error": str(e)[:120]}
          with ThreadPoolExecutor(max_workers=8) as pool:
              for name, r in pool.map(_run, steps):
                  try:
                    json.dumps(r); safe = r
                  except TypeError:
                    safe = json.loads(json.dumps(r, default=str))
                  out[name] = {"ok": bool(safe.get("ok", True)) if isinstance(safe, dict) else True,
                               "summary": {k: safe.get(k) for k in ("topics","facts","count","round","status","keep","fix","idle","sources","books","priced","covers") if isinstance(safe, dict) and k in safe}}
          for name, mod, fn in []:
            try:
              m = __import__(mod)
              r = getattr(m, fn)()
              try:
                  json.dumps(r)
                  safe = r
              except TypeError:
                  def _clean(v):
                      if isinstance(v, dict): return {str(k): _clean(x) for k,x in v.items()}
                      if isinstance(v, (list, tuple)): return [_clean(x) for x in v]
                      if isinstance(v, (str,int,float,bool)) or v is None: return v
                      return str(v)[:180]
                  safe = _clean(r)
              r = safe
              out[name] = {"ok": bool(r.get("ok", True)),
                           "summary": {k: r.get(k) for k in
                                       ("topics", "facts", "count", "round", "status",
                                        "keep", "fix", "idle", "sources") if k in r}}
            except Exception as e:
              out[name] = {"ok": False, "error": str(e)[:160]}
              traceback.print_exc()
          # Owner wants ~1-minute pulses. GitHub cron minimum is 5 min, so
          # run five sub-cycles inside this job (~every 60 seconds).
          for cycle in range(5):
              for name, mod, fn in [("next", "next_development", "run"),
                                    ("reasoning", "reasoning_engine", "run"),
                                    ("pagefix", "page_auto_fixer", "run"),
                                    ("outreach", "outreach_engine", "run"),
                                    ("selfnudge", "self_nudge", "run"),
                                    ("league", "improvement_league", "run"),
                                     ("freepool", "free_image_sources", "run"),
                                     ("difflab", "diffusion_like", "run"),
                                     ("coverpub", "cover_publisher", "run"),
                                     ("covers", "cover_designer", "run"),
                                    ("store_audit", "storefront_rebuild", "run"),
                                    ("roadmap", "future_roadmap", "run"),
                                    ("wish", "wish_cycle", "run"),
                                    ("revenue_auto", "revenue_autopilot", "run"),
                                    ("cross", "cross_ask", "run"),
                                    ("samples", "sample_publisher", "run"),
                                    ("typeset", "book_typesetter", "run"),
                                    ("ebook_complete", "ebook_complete", "run"),
                                    ("ebook", "ebook_design_team", "run"),
                                    ("editor", "ebook_editor_gate", "run"),
                                    ("diff", "differentiation_lab", "run"),
                                     ("value", "book_value_fixer", "run"),
                                     ("uiaudit", "ui_functional_audit", "run"),
                                     ("storetest", "store_access_test", "run"),
                                     ("progress", "department_progress", "run"),
                                     ("design", "system_design", "run"),
                                     ("security", "security_audit", "run"),
                                     ("jarvis", "jarvis_directive", "run"),
                                     ("learner", "global_code_learner", "run"),
                                     ("radar", "tech_radar", "run"),
                                     ("modernize", "book_modernizer", "run"),
                                     ("it_review", "it_integration_review", "run")]:
                  try:
                      m = __import__(mod)
                      r = getattr(m, fn)()
                      out[name + "_pulse" + str(cycle+1)] = {
                          "ok": bool(r.get("ok", True)),
                          "fix": r.get("fix"), "keep": r.get("keep")}
                  except Exception as e:
                      out[name + "_pulse" + str(cycle+1)] = {"ok": False,
                                                             "error": str(e)[:120]}
              if cycle < 4:
                  _t.sleep(8)
          # ASSEMBLY: combine every department's output into ONE deliverable.
          try:
              import storefront_rebuild, cover_designer, future_roadmap
              store = storefront_rebuild.run(apply=True)
              covers = cover_designer.run(apply=True)
              plan = future_roadmap.run(apply=True)
              out["assembly"] = {"ok": True,
                  "store": {k: store.get(k) for k in ("books","price_min","price_max","unique_prices")},
                  "covers": covers.get("covers"),
                  "next_plan": [t["id"] for t in plan.get("next_five", [])],
                  "note": "ทุกแผนกส่งงานแยกกัน → ประกอบเป็นร้าน+ปก+แผนชิ้นเดียว"}
          except Exception as e:
              out["assembly"] = {"ok": False, "error": str(e)[:160]}
          print(json.dumps(out, ensure_ascii=False, indent=2))
          open("data/autonomy_last.json", "w", encoding="utf-8").write(
              json.dumps(out, ensure_ascii=False, indent=2))
          import datetime
          lines = ["# Zyphere ทำงานเองโดยไม่มีผู้ใช้สั่ง", "",
                   "เวลา: " + datetime.datetime.utcnow().isoformat() + "Z",
                   "รันโดย: GitHub Actions autonomy.yml (cron 5 นาที + Render self-dispatch ทุก 60 วิ · 5 pulse ย่อย)"
                   "โหมด: ทุกแผนกทำงานคู่ขนาน (max 8 workers) → ประกอบผลเป็นชิ้นเดียว", "",
                   "| ฝ่าย | ผลที่เกิดจริง |", "|---|---|"]
          for name, r in out.items():
              lines.append("| %s | %s |" % (name, json.dumps(r, ensure_ascii=False)[:220]))
          lines += ["", "ถ้าฝ่ายไหนมี error ระบบจะเรียนรู้แล้วพยายามแก้ในรอบถัดไป", ""]
          open("governance/AUTONOMY_LIVE.md", "w", encoding="utf-8").write("\n".join(lines))
          PY
      - name: Publish artefacts and report
        run: |
          git config user.name "Zyphere Autonomy"
          git config user.email "zyphere@users.noreply.github.com"
          git add -A
          git commit -m "Autonomy: all departments learn and develop (unattended)" || true
          git pull --rebase origin main || true
          git push || true
